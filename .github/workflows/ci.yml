name: PR checks

on:
  pull_request:
    # Stacked feature PRs also need checks before their base reaches develop.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  project-history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - run: node --test scripts/project-history.test.mjs

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run ci

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_DB: jibro_test
          POSTGRES_USER: jibro
          POSTGRES_PASSWORD: ci-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U jibro -d jibro_test"
          --health-interval 5s --health-timeout 3s --health-retries 15
    env:
      DB_USERNAME: jibro
      DB_PASSWORD: ci-only-password
      TEST_DB_URL: jdbc:postgresql://localhost:5432/jibro_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - run: chmod +x gradlew
      - run: ./gradlew --no-daemon clean build integrationTest
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: backend-test-reports
          path: backend/build/reports/tests/

# Java formatter gate is pending a pinned IntelliJ CLI runtime on CI.
# spotlessCheck remains an explicit task and must fail if the formatter is unavailable.

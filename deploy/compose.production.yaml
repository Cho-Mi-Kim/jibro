name: jibro-production

# Independent immutable release images; this file never starts a development DB.
services:
  backend:
    image: ${BACKEND_IMAGE:?Set the backend release image digest}
    env_file:
      - path: ./runtime.env
        required: true
        format: raw
    environment:
      SPRING_PROFILES_ACTIVE: production
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: 8080
      AUTH_SECURE_COOKIE: 'true'
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    volumes:
      - ${RDS_CA_FILE:?Set the RDS CA certificate file}:/run/rds-ca/global-bundle.pem:ro
    restart: unless-stopped
    init: true
    mem_limit: 1536m
    pids_limit: 160
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 40s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    networks: [app]

  web:
    image: ${WEB_IMAGE:?Set the frontend release image digest}
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?Set the public DNS hostname}
      NGINX_ENVSUBST_FILTER: PUBLIC_HOST
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ${TLS_DIRECTORY:?Set the certificate directory}:/etc/nginx/tls:ro
      - ${ACME_DIRECTORY:?Set the public challenge directory}:/var/www/acme:ro
    read_only: true
    tmpfs:
      - /etc/nginx/conf.d:size=1m,mode=0755
      - /var/cache/nginx:size=16m,mode=0755
      - /run:size=1m,mode=0755
      - /tmp:size=4m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    mem_limit: 128m
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    networks: [app]

networks:
  app:
    driver: bridge

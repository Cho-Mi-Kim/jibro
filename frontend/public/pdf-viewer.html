<!doctype html>
<html lang="ko">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>공고문 보기</title>
        <style>
            body {
                margin: 0;
                background: #eee;
                color: #262626;
                font-family: sans-serif;
            }
            header {
                position: sticky;
                top: 0;
                background: white;
                padding: 12px;
                display: flex;
                gap: 12px;
                align-items: center;
                justify-content: center;
            }
            button,
            a {
                font: inherit;
                padding: 8px;
            }
            main {
                text-align: center;
                padding: 12px;
            }
            img {
                max-width: 100%;
                height: auto;
                box-shadow: 0 2px 10px #0003;
            }
        </style>
    </head>
    <body>
        <header>
            <button id="prev" type="button">이전 쪽</button
            ><strong id="page"></strong
            ><button id="next" type="button">다음 쪽</button
            ><a id="original" target="_blank" rel="noreferrer">PDF 원본</a>
        </header>
        <main>
            <p id="message" role="status">공고문을 불러오는 중입니다.</p>
            <img id="image" alt="공고문 페이지" />
        </main>
        <script type="module">
            import { relocateEvidence } from '/evidence-relocation.js';
            const params = new URLSearchParams(location.search),
                id = params.get('file'),
                initial = params.get('page');
            let page = Number(initial),
                sha = params.get('sha'),
                relocated = false,
                request = 0;
            const message = document.querySelector('#message'),
                img = document.querySelector('#image'),
                label = document.querySelector('#page'),
                prev = document.querySelector('#prev'),
                next = document.querySelector('#next'),
                original = document.querySelector('#original');
            if (
                !/^\d{1,20}$/.test(id || '') ||
                !Number.isSafeInteger(page) ||
                page < 1 ||
                page > 1000 ||
                (sha !== null && !/^[0-9a-f]{64}$/.test(sha))
            ) {
                message.textContent = '올바른 공고문 경로가 아닙니다.';
                prev.disabled = true;
                next.disabled = true;
                img.hidden = true;
                original.hidden = true;
            } else {
                original.href = '/api/v1/notices/official-pdf/' + id;
                function show() {
                    const current = ++request;
                    message.hidden = false;
                    message.textContent = '공고문을 불러오는 중입니다.';
                    img.hidden = true;
                    label.textContent = page + '쪽';
                    prev.disabled = page <= 1;
                    img.onload = () => {
                        if (current !== request) return;
                        message.hidden = !relocated;
                        if (relocated)
                            message.textContent =
                                '변경된 공고에서 같은 내용을 다시 확인했습니다.';
                        img.hidden = false;
                    };
                    img.onerror = async () => {
                        if (current !== request) return;
                        if (sha && !relocated) {
                            try {
                                const found = await relocateEvidence(id, sha, {
                                    location: '공고문 ' + page + '쪽',
                                });
                                if (current !== request) return;
                                const m =
                                    found &&
                                    /^공고문 ([1-9][0-9]{0,3})쪽$/.exec(
                                        found.location,
                                    );
                                if (m && Number(m[1]) <= 1000) {
                                    page = Number(m[1]);
                                    sha = found.sha256;
                                    relocated = true;
                                    show();
                                    return;
                                }
                            } catch {
                                /* Keep the official source link available. */
                            }
                        }
                        message.hidden = false;
                        message.textContent =
                            '변경된 공고에서 같은 페이지를 확인할 수 없습니다. PDF 원본을 확인해 주세요.';
                    };
                    img.src =
                        '/api/v1/notices/official-pdf/' +
                        id +
                        '/page/' +
                        page +
                        (sha ? '?sha256=' + sha : '');
                    history.replaceState(
                        null,
                        '',
                        '?file=' +
                            id +
                            '&page=' +
                            page +
                            (sha ? '&sha=' + sha : ''),
                    );
                }
                prev.onclick = () => {
                    if (page > 1) {
                        page--;
                        show();
                    }
                };
                next.onclick = () => {
                    if (page < 1000) {
                        page++;
                        show();
                    }
                };
                show();
            }
        </script>
    </body>
</html>

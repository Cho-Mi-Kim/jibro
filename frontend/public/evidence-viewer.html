<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>공식 자료 내용 확인</title><style>body{margin:0;background:#faf8f5;color:#262626;font:16px/1.6 sans-serif}header{position:sticky;top:0;background:#fff;border-bottom:1px solid #ddd;padding:12px;z-index:1;display:flex;justify-content:space-between;gap:10px}main{max-width:850px;margin:auto;padding:16px}p{white-space:pre-wrap;overflow-wrap:anywhere}p:target{background:#fff1c7;outline:2px solid #e0aa23;padding:8px;scroll-margin-top:90px}.note{color:#555}a{color:#a53d26}</style></head><body><header><strong>공식 자료 내용 확인</strong><a id="original" target="_blank" rel="noreferrer">공식 원본 열기 ↗</a></header><main><p class="note">2026.11.12에 확인한 자료에서 추출한 내용입니다. 원본이 이후 변경됐을 수 있으며, 표와 서식은 공식 원본에서 확인하세요.</p><p id="status" role="status">자료를 불러오는 중입니다.</p><div id="content"></div></main><script type="module">import {relocateEvidence} from "/evidence-relocation.js";const q=new URLSearchParams(location.search),id=q.get('file'),at=Number(q.get('at'));const status=document.querySelector('#status');if(!/^\d{1,20}$/.test(id||'')||!Number.isSafeInteger(at)||at<0){status.textContent='올바른 자료 경로가 아닙니다.'}else{try{const response=await fetch('/evidence-extracts.json');if(!response.ok)throw Error();const data=(await response.json())[id];if(!data||at>=data.paragraphs.length)throw Error();document.querySelector('#original').href=data.sourceUrl;const source=new URL(data.sourceUrl);if(source.hostname!=='apply.lh.or.kr'||source.pathname!=='/lhapply/lhFile.do'||source.searchParams.get('fileid')!==id){status.textContent='공식 상세 내용은 원본을 직접 확인해 주세요.';throw new Error('DETAIL_SOURCE_REQUIRES_REVIEW')}const check=await fetch('/api/v1/notices/official-pdf/'+id+'/fingerprint');if(!check.ok)throw new Error('SOURCE_CHECK_FAILED');const fingerprint=await check.json();if(fingerprint.sha256!==data.sha256){const match=await relocateEvidence(id,data.sha256);if(!match||match.sha256!==fingerprint.sha256)throw new Error('SOURCE_CHANGED');document.querySelector('.note').textContent='변경된 공식 원문에서 같은 내용을 다시 확인했습니다. 표와 서식은 공식 원본에서 확인하세요.'}const container=document.querySelector('#content');data.paragraphs.forEach((text,i)=>{const element=document.createElement('p');element.id='part-'+i;element.textContent=text;container.appendChild(element)});status.remove();location.hash='part-'+at;document.getElementById('part-'+at).scrollIntoView({block:'start'})}catch(error){status.textContent=error.message==='SOURCE_CHANGED'?'원문이 변경되어 저장된 위치를 표시할 수 없습니다. 공식 원본을 확인해 주세요.':'자료를 확인할 수 없습니다. 공식 원본을 확인해 주세요.';if(!document.querySelector('#original').getAttribute('href'))document.querySelector('#original').href='https://apply.lh.or.kr/lhapply/lhFile.do?fileid='+id}}</script></body></html>

spring:
  application:
    name: jibro-housing
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:15432/jibro}
    username: ${DB_USERNAME:jibro}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  mail:
    properties:
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 8000
      "[mail.smtp.writetimeout]": 8000
      "[mail.smtp.auth]": ${JIBRO_SMTP_AUTH:true}
      "[mail.smtp.starttls.enable]": ${JIBRO_SMTP_STARTTLS:true}
      "[mail.smtp.starttls.required]": ${JIBRO_SMTP_STARTTLS:true}
  flyway:
    enabled: true
  jackson:
    time-zone: UTC

server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

app:
  auth:
    jwt-secret: ${JWT_SECRET}
    secure-cookie: ${AUTH_SECURE_COOKIE:true}
    frontend-url: ${FRONTEND_URL:http://127.0.0.1:5173}

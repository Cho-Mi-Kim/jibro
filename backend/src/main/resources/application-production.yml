server:
  forward-headers-strategy: framework
  tomcat:
    redirect-context-root: false
    threads:
      max: 100
      min-spare: 10
    accesslog:
      enabled: false
  shutdown: graceful
spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  jpa:
    show-sql: false
logging:
  level:
    org.springframework.web: WARN
    org.springframework.security: WARN
